<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画廊 - Octopath Traveler</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 40px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .gallery-thumb {
      border-radius: var(--border-radius);
      overflow: hidden;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1a1a3e, #0f3460);
      background-size: cover;
      background-position: center;
      cursor: pointer;
      border: 1px solid var(--color-border);
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .gallery-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
    }
    .gallery-thumb:hover {
      border-color: var(--color-hover);
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .gallery-thumb__label {
      position: relative;
      z-index: 1;
      color: #e8d5b0;
      font-size: 0.78rem;
      text-align: center;
      padding: 8px 10px;
      letter-spacing: 0.03em;
      line-height: 1.3;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    /* Canvas 标注区 */
    .canvas-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    #drawCanvas {
      display: block;
      max-width: 100%;
      border: 2px solid var(--color-border);
      border-radius: var(--border-radius);
      cursor: crosshair;
      background: #0a0a14;
    }
    .canvas-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-sm);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .canvas-toolbar label {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }
    .color-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .color-btn:hover { transform: scale(1.2); }
    .color-btn.active { border-color: #fff; transform: scale(1.2); }
    .tool-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      border: 1px solid var(--color-border);
      background: var(--color-bg-card);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tool-btn:hover, .tool-btn.active {
      background: rgba(110,64,170,0.3);
      border-color: var(--color-hover);
      color: var(--color-hover);
    }
    .canvas-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }
    .section { padding: 60px 24px 0; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header__left">
      <span class="header__logo">OCTOPATH</span>
      <span class="header__subtitle">八方旅人 · HD-2D</span>
    </div>
    <div class="header__right">
      <div class="clock-widget" id="clockWidget">00:00:00</div>
      <div class="countdown-widget" id="countdownWidget">--:--:--</div>
      <button class="btn-login" id="btnLogin">登 录</button>
      <div class="user-info" id="userInfo" style="display:none;">
        <span class="gem-dot"></span>
        <span class="user-name" id="userName"></span>
      </div>
    </div>
  </header>

  <nav class="site-nav">
    <ul class="nav__primary">
      <li class="nav__item"><a class="nav__link" href="../index.html">首页</a></li>
      <li class="nav__item"><a class="nav__link" href="characters.html">角色档案</a></li>
      <li class="nav__item"><a class="nav__link" href="jobs.html">职业系统</a></li>
      <li class="nav__item"><a class="nav__link" href="world.html">大陆纪行</a></li>
      <li class="nav__item"><a class="nav__link" href="story.html">剧情之旅</a></li>
      <li class="nav__item"><a class="nav__link" href="battle.html">战斗指南</a></li>
      <li class="nav__item active"><a class="nav__link" href="gallery.html">画廊</a></li>
      <li class="nav__item"><a class="nav__link" href="pubmed.html">文献检索</a></li>
    </ul>
  </nav>

  <main style="margin-top: calc(var(--header-height) + var(--nav-height));">
    <div class="section">
      <h2 class="section-title">HD-2D 画廊</h2>
      <p class="section-subtitle">像素与光影交织的瞬间 · 点击图片进入标注模式</p>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>

    <!-- Canvas 标注工具 -->
    <div class="canvas-section" id="canvasSection" style="display:none;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <h3 style="font-size:1rem;color:var(--color-text-primary);">🖌️ 交互标注模式</h3>
        <button class="tool-btn active" id="btnDrawMode" onclick="toggleDrawMode()">开启标注</button>
        <button class="tool-btn" onclick="clearCanvas()">清空画布</button>
        <button class="tool-btn" onclick="saveCanvas()">保存图片</button>
        <button class="tool-btn" onclick="closeCanvasSection()">关闭</button>
      </div>

      <div class="canvas-toolbar" id="canvasToolbar" style="display:none;">
        <!-- 颜色选择 -->
        <label>颜色:</label>
        <span class="color-btn active" style="background:#c9a227;" onclick="setColor('#c9a227', this)"></span>
        <span class="color-btn" style="background:#ff4444;" onclick="setColor('#ff4444', this)"></span>
        <span class="color-btn" style="background:#4d9fff;" onclick="setColor('#4d9fff', this)"></span>
        <span class="color-btn" style="background:#4dff4d;" onclick="setColor('#4dff4d', this)"></span>
        <span class="color-btn" style="background:#ffffff;" onclick="setColor('#ffffff', this)"></span>
        <span class="color-btn" style="background:#9b6dff;" onclick="setColor('#9b6dff', this)"></span>
        <label style="margin-left:12px;">线宽:</label>
        <input type="range" min="1" max="12" value="3" id="lineWidth" style="width:80px;" oninput="setLineWidth(this.value)">
        <span style="font-size:0.75rem;color:var(--color-text-muted);" id="lineWLabel">3px</span>
        <button class="tool-btn" onclick="undoStroke()">撤销</button>
        <button class="tool-btn" onclick="eraserMode()">橡皮擦</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="drawCanvas" width="1000" height="560"></canvas>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer__links">
      <a href="mailto:3139507341@qq.com">联系我们：3139507341@qq.com</a>
    </div>
    <p class="footer__copyright">© 2026 Octopath Traveler 主题网站</p>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    // 画廊缩略图数据
    const GALLERY_ITEMS = [
      { title: 'HD-2D 城镇场景 · 戈尔戈农港', img: 'town1.png' },
      { title: 'HD-2D 战斗场景 · 弱点破盾', img: 'battle1.png' },
      { title: 'HD-2D 森林场景 · 爱德拉斯城', img: 'forest1.png' },
      { title: 'HD-2D 雪景 · 冰川大陆', img: 'snow1.png' },
      { title: 'HD-2D 沙漠场景 · 阳光大陆绿洲', img: 'desert1.png' },
      { title: 'HD-2D 海岸场景 · 港口城市', img: 'coast1.png' },
      { title: 'HD-2D 遗迹场景 · 斗技场', img: 'ruins1.png' },
      { title: 'HD-2D 旅馆场景 · 旅人之家', img: 'inn1.png' },
      { title: 'HD-2D 城镇夜景 · 昼夜交替', img: 'highland1.png' },
      { title: 'HD-2D 图书馆 · 学者赛拉斯', img: 'library1.png' },
      { title: 'HD-2D 河川场景 · 水乡', img: 'river1.png' },
      { title: 'HD-2D 世界地图 · 奥鲁斯特拉', img: 'hero_bg.png' },
    ];

    const grid = document.getElementById('galleryGrid');
    GALLERY_ITEMS.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'gallery-thumb';
      div.style.backgroundImage = `url('../图集/${item.img}')`;
      div.style.backgroundSize = 'cover';
      div.style.backgroundPosition = 'center';
      div.innerHTML = `<span class="gallery-thumb__label">${item.title}</span>`;
      div.onclick = () => openCanvasWithImage(i, item.title, item.img);
      grid.appendChild(div);
    });

    // Canvas 绘图
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let currentColor = '#c9a227';
    let currentLineWidth = 3;
    let lastX = 0, lastY = 0;
    let strokes = []; // 撤销用
    let currentStroke = [];
    let isErasing = false;
    let currentBgImage = null;
    let currentBgSrc = '';

    function openCanvasWithImage(idx, title, imgFile) {
      document.getElementById('canvasSection').style.display = 'block';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes = [];
      // 加载真实图片作为背景
      const bg = new Image();
      bg.onload = function() {
        currentBgImage = bg;
        currentBgSrc = `../图集/${imgFile}`;
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
      };
      bg.onerror = function() {
        // Fallback to gradient
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, '#1a1a2e');
        grad.addColorStop(0.5, '#16213e');
        grad.addColorStop(1, '#0f3460');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.font = '28px Georgia';
        ctx.fillText(title, 40, 50);
      };
      bg.src = `../图集/${imgFile}`;
    }

    function closeCanvasSection() {
      document.getElementById('canvasSection').style.display = 'none';
    }

    function toggleDrawMode() {
      const toolbar = document.getElementById('canvasToolbar');
      const btn = document.getElementById('btnDrawMode');
      const show = toolbar.style.display === 'none';
      toolbar.style.display = show ? 'flex' : 'none';
      btn.textContent = show ? '关闭标注' : '开启标注';
      btn.classList.toggle('active', show);
      canvas.style.cursor = show ? 'crosshair' : 'default';
    }

    function setColor(color, el) {
      currentColor = color;
      isErasing = false;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function setLineWidth(w) {
      currentLineWidth = parseInt(w);
      document.getElementById('lineWLabel').textContent = w + 'px';
    }

    function eraserMode() {
      isErasing = true;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      if (e.touches) {
        return {
          x: (e.touches[0].clientX - rect.left) * scaleX,
          y: (e.touches[0].clientY - rect.top) * scaleY
        };
      }
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousedown', e => { drawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; currentStroke = [{x:p.x,y:p.y}]; });
    canvas.addEventListener('mousemove', e => { if (!drawing) return; const p = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.strokeStyle = isErasing ? '#0a0a14' : currentColor; ctx.lineWidth = isErasing ? currentLineWidth*4 : currentLineWidth; ctx.lineCap = 'round'; ctx.stroke(); currentStroke.push({x:p.x,y:p.y}); lastX = p.x; lastY = p.y; });
    canvas.addEventListener('mouseup', () => { if (drawing) { strokes.push(currentStroke); drawing = false; } });
    canvas.addEventListener('mouseleave', () => { drawing = false; });

    // 触摸支持
    canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; currentStroke = [{x:p.x,y:p.y}]; }, {passive:false});
    canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!drawing) return; const p = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.strokeStyle = isErasing ? '#0a0a14' : currentColor; ctx.lineWidth = isErasing ? currentLineWidth*4 : currentLineWidth; ctx.lineCap = 'round'; ctx.stroke(); currentStroke.push({x:p.x,y:p.y}); lastX = p.x; lastY = p.y; }, {passive:false});
    canvas.addEventListener('touchend', () => { if (drawing) { strokes.push(currentStroke); drawing = false; } });

    function undoStroke() {
      if (strokes.length === 0) return;
      strokes.pop();
      // 重绘（简化处理：清空重绘背景+剩余笔画）
      redrawCanvas();
    }

    function redrawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (currentBgImage) {
        ctx.drawImage(currentBgImage, 0, 0, canvas.width, canvas.height);
      } else {
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, '#1a1a2e');
        grad.addColorStop(1, '#0f3460');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      // 重绘所有笔画
      strokes.forEach(stroke => {
        if (stroke.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          ctx.lineTo(stroke[i].x, stroke[i].y);
        }
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentLineWidth;
        ctx.lineCap = 'round';
        ctx.stroke();
      });
    }

    function clearCanvas() {
      strokes = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, '#1a1a2e');
      grad.addColorStop(1, '#0f3460');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function saveCanvas() {
      const link = document.createElement('a');
      link.download = 'octopath_gallery_annotation.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
