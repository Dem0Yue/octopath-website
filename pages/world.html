<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大陆纪行 - Octopath Traveler</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .region-list { max-width:1100px; margin:40px auto; padding:0 24px 60px; }
    .region-item { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:40px; align-items:center; }
    .region-item:nth-child(even) { direction:rtl; }
    .region-item:nth-child(even) > * { direction:ltr; }
    .region-img { aspect-ratio:16/9; border-radius:var(--border-radius); overflow:hidden; background:linear-gradient(135deg,#1a1a3e,#0f3460); display:flex; align-items:center; justify-content:center; color:var(--color-text-muted); font-size:0.85rem; position:relative; }
    .day-night-toggle { position:absolute; top:10px; right:10px; display:flex; gap:4px; }
    .toggle-btn { padding:4px 10px; font-size:0.65rem; border-radius:20px; border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.5); color:#fff; cursor:pointer; transition:all 0.2s; }
    .toggle-btn.active { background:rgba(110,64,170,0.7); border-color:var(--color-hover); }
    .region-info { padding:20px; }
    .region-name { font-size:1.3rem; font-weight:700; color:var(--color-text-primary); margin-bottom:4px; letter-spacing:0.1em; }
    .region-en { font-size:0.7rem; color:var(--color-text-muted); letter-spacing:0.2em; text-transform:uppercase; margin-bottom:16px; }
    .region-desc { font-size:0.9rem; color:var(--color-text-secondary); line-height:1.8; margin-bottom:16px; }
    .region-tags { display:flex; flex-wrap:wrap; gap:6px; }
    .r-tag { padding:3px 10px; background:rgba(110,64,170,0.15); border:1px solid rgba(110,64,170,0.3); border-radius:20px; font-size:0.65rem; color:var(--color-hover); }
    .section { padding:60px 24px 0; max-width:1400px; margin:0 auto; }
    @media(max-width:768px) { .region-item { grid-template-columns:1fr; } .region-item:nth-child(even){ direction:ltr; } }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header__left"><span class="header__logo">OCTOPATH</span><span class="header__subtitle">八方旅人 · HD-2D</span></div>
    <div class="header__right">
      <div class="clock-widget" id="clockWidget">00:00:00</div>
      <div class="countdown-widget" id="countdownWidget">--:--:--</div>
      <button class="btn-login" id="btnLogin">登 录</button>
      <div class="user-info" id="userInfo" style="display:none;"><span class="gem-dot"></span><span class="user-name" id="userName"></span></div>
    </div>
  </header>

  <nav class="site-nav">
    <ul class="nav__primary">
      <li class="nav__item"><a class="nav__link" href="../index.html">首页</a></li>
      <li class="nav__item"><a class="nav__link" href="characters.html">角色档案</a></li>
      <li class="nav__item"><a class="nav__link" href="jobs.html">职业系统</a></li>
      <li class="nav__item active"><a class="nav__link" href="world.html">大陆纪行</a></li>
      <li class="nav__item"><a class="nav__link" href="story.html">剧情之旅</a></li>
      <li class="nav__item"><a class="nav__link" href="battle.html">战斗指南</a></li>
      <li class="nav__item"><a class="nav__link" href="gallery.html">画廊</a></li>
      <li class="nav__item"><a class="nav__link" href="pubmed.html">文献检索</a></li>
    </ul>
  </nav>

  <main style="margin-top:calc(var(--header-height) + var(--nav-height));">
    <div class="section">
      <h2 class="section-title">奥鲁斯特拉大陆</h2>
      <p class="section-subtitle">昼夜交替 · 探索八域 · 东西大陆的壮阔旅程</p>
    </div>

    <div class="region-list" id="regionList"></div>
  </main>

  <footer class="site-footer">
    <div class="footer__links"><a href="mailto:3139507341@qq.com">联系我们：3139507341@qq.com</a></div>
    <p class="footer__copyright">© 2026 Octopath Traveler 主题网站</p>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    const REGIONS = [
      { name:'冰川大陆地区', en:'Flameglass', chars:'海茵特·终章', desc:'寒风呼啸的永冻之地，古老的冰晶封印着不为人知的力量。终年积雪的山谷中，隐藏着通往极北之地的秘密通道。', tags:['寒冷','遗迹','冰晶'], dayColor:'#a8d8ea', nightColor:'#1a3a5c' },
      { name:'平原大陆地区', en:'Flares Plateau', chars:'欧贝利克·故乡', desc:'麦浪滚滚的丰饶之地，城堡与村庄星罗棋布。辽阔的草原是骑士们练剑的最佳场所，也是奥鲁斯特拉最繁华的心脏地带。', tags:['平原','城堡','农庄'], dayColor:'#d4a76a', nightColor:'#2d2a1a' },
      { name:'海岸大陆地区', en:'Coastland', chars:'特蕾莎·出身地', desc:'碧海银沙的贸易港都，商船往来帆影点点。戈尔戈农港是东西方贸易的枢纽，各色人种与奇异货物汇聚于此。', tags:['海港','贸易','美食'], dayColor:'#5bc0eb', nightColor:'#0d2137' },
      { name:'高原大陆地区', en:'Highland', chars:'普里姆萝斯·逃亡', desc:'云端之上的险峻高原，矿山与要塞密布。这里的空气稀薄而寒冷，只有最坚强的旅人才能穿越这片挑战之地。', tags:['高原','矿山','要塞'], dayColor:'#c9b18c', nightColor:'#2a2010' },
      { name:'阳光大陆地区', en:'Sunlands', chars:'阿芬·流浪地', desc:'黄沙漫漫的炽热荒漠，绿洲与古城静默伫立。古代文明的遗迹被风沙掩埋，只有最有耐心的探索者才能发现其中的宝藏。', tags:['沙漠','绿洲','遗迹'], dayColor:'#e8c47c', nightColor:'#3d2a10' },
      { name:'河川大陆地区', en:'Riverlands', chars:'赛拉斯·探索', desc:'水网纵横的湿润水乡，舟楫如梭稻花飘香。迷宫般的水道是天然的屏障，也孕育了独特的水上文化。', tags:['水乡','舟楫','稻田'], dayColor:'#8ec88a', nightColor:'#1a2a1a' },
      { name:'断崖大陆地区', en:'Flatlands', chars:'提里昂·追忆', desc:'巨壁如削的险峻绝境，鹰隼盘旋云雾缭绕。这里是盗贼与赏金猎人的天堂，也是通往地下世界的入口。', tags:['断崖','盗贼','地下'], dayColor:'#a0785a', nightColor:'#1a0d00' },
      { name:'丛林大陆地区', en:'Woodlands', chars:'奥菲利亚·试炼', desc:'密林深处的神秘禁地，古代文明遗迹隐匿其中。参天古木遮天蔽日，奇异生物出没其间，是自然与神秘交织的禁区。', tags:['丛林','遗迹','秘宝'], dayColor:'#4a8c5c', nightColor:'#0d1a0d' },
    ];

    const list = document.getElementById('regionList');
    REGIONS.forEach((r, i) => {
      const div = document.createElement('div');
      div.className = 'region-item';
      div.innerHTML = `
        <div class="region-img" id="regionImg${i}" style="background:linear-gradient(135deg,${r.dayColor},${r.dayColor}88);">
          <img src="../图集/${['snow1.png','town1.png','coast1.png','highland1.png','desert1.png','river1.png','ruins1.png','forest1.png'][i]}" alt="${r.name}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:var(--border-radius);" onerror="this.style.display='none';">
          <div class="night-overlay" id="nightOverlay${i}" style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,0.55),rgba(0,0,0,0.7));border-radius:var(--border-radius);display:none;z-index:1;pointer-events:none;"></div>
          <div class="day-night-toggle">
            <button class="toggle-btn active" onclick="setDay(${i},'day',this)">昼</button>
            <button class="toggle-btn" onclick="setDay(${i},'night',this)">夜</button>
          </div>
          <span style="position:absolute;bottom:10px;left:12px;background:rgba(0,0,0,0.6);padding:4px 10px;border-radius:12px;font-size:0.75rem;z-index:2;">【${r.name}】</span>
        </div>
        <div class="region-info">
          <div class="region-name">${r.name}</div>
          <div class="region-en">${r.en}</div>
          <p class="region-desc">${r.desc}</p>
          <div class="region-tags">
            ${r.tags.map(t => `<span class="r-tag">${t}</span>`).join('')}
          </div>
        </div>
      `;
      list.appendChild(div);
    });

    function setDay(idx, mode, btn) {
      const r = REGIONS[idx];
      const el = document.getElementById('regionImg' + idx);
      const overlay = document.getElementById('nightOverlay' + idx);
      btn.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (mode === 'night') {
        overlay.style.display = 'block';
        el.style.background = 'none';
      } else {
        overlay.style.display = 'none';
        el.style.background = `linear-gradient(135deg,${r.dayColor},${r.dayColor}88)`;
      }
    }
  </script>
</body>
</html>
